[package]
name = "tomba"
description = "Official Rust client library for the Tomba Email Finder API"
version = "1.1.0"
authors = ["Mohamed Ben <b.mohamed@tomba.io>"]
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
categories = ["email", "api-bindings"]
keywords = ["email", "email-finder", "tomba", "email-verifier", "email-validation"]
exclude = [".gitignore", ".cargo/config", ".github/"]
homepage = "https://tomba.io/"
repository = "https://github.com/tomba-io/rust"
rust-version = "1.63"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mockito = "1"

[profile.release]
overflow-checks = true
lto = true
